[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexability-ml"
version = "0.1.0"
description = "Machine learning utilities for NexAbility document parsing, normalization, matching, and accessibility analysis."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pypdf>=6.0",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
groq = [
  "groq==1.7.0",
]
embeddings = [
  "sentence-transformers==6.2.0",
  "torch==2.15.0",
  "transformers==5.22.1",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "fastapi>=0.115",
  "httpx>=0.27",
]
service = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nexability_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "integration: tests that call a real external service",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
